<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý rà soát pháp lý toàn bộ DN</title>
<style>
:root{
  --bg:#f5f5f7; --surface:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --line2:#d2d2d7;
  --navy:#1d1d1f; --navy2:#0071e3; --accent:#0071e3;
  --red:#d70015; --red-bg:#ffefef; --amber:#b25000; --amber-bg:#fff4e5; --green:#1c8a3a; --green-bg:#e9f8ee; --gray-bg:#f0f0f3; --blue-bg:#eaf3ff; --blue:#0066cc;
  --input:#fff;
  --r:18px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html{font-size:15px;-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.47;letter-spacing:-.011em}
header.top{background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(0,0,0,.08)}
.top-in{max-width:1500px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:inline-flex;align-items:center;height:46px;font-weight:700;letter-spacing:.14em;font-size:1rem;color:var(--ink)}
.logo img{height:46px;width:auto;display:block}
.brand h1{font-size:.95rem;margin:0;font-weight:600;line-height:1.2;padding-left:12px;border-left:1px solid var(--line2);color:var(--ink)}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;background:rgba(120,120,128,.12);padding:3px;border-radius:11px}
nav.tabs button{background:transparent;border:0;color:var(--ink);padding:6px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:.86rem;font-weight:500;transition:background .15s}
nav.tabs button:hover{background:rgba(255,255,255,.55)}
nav.tabs button.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
.tools{display:flex;gap:6px;align-items:center}
.saved{font-size:.75rem;color:var(--muted);min-width:70px;text-align:right}
main{max-width:1500px;margin:0 auto;padding:28px 24px 72px}
h2.page{margin:6px 0 4px;font-size:2rem;font-weight:700;letter-spacing:-.03em;color:var(--ink);line-height:1.15}
.sub{color:var(--muted);font-size:.95rem;margin:0 0 22px}
h3.sec{margin:36px 0 12px;font-size:1.25rem;font-weight:700;letter-spacing:-.02em;color:var(--ink);display:flex;align-items:baseline;gap:8px}
.note{font-size:.8rem;color:var(--muted);margin:8px 2px 0}
.card{background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .l{font-size:.75rem;color:var(--muted);font-weight:600}
.kpi .n{font-size:2.3rem;font-weight:700;color:var(--ink);line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.kpi .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.kpi.red .n{color:var(--red)}.kpi.amber .n{color:var(--amber)}.kpi.green .n{color:var(--green)}
.banner{margin-top:14px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);border-radius:14px;padding:12px 18px;font-size:.9rem}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:12px}
.ring-card{display:flex;align-items:center;gap:18px;background:var(--surface);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.ring{--p:0;--c:var(--accent);width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--gray-bg) 0);display:grid;place-items:center;flex:none}
.ring i{width:70px;height:70px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:1.15rem;color:var(--ink);letter-spacing:-.02em}
.ring-card .l{font-size:.78rem;color:var(--muted);font-weight:600}
.ring-card .s{font-size:.85rem;color:var(--ink);margin-top:3px}
.tw{overflow:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--muted);font-weight:600;text-align:left;padding:11px 12px;white-space:nowrap;position:sticky;top:0;z-index:1;font-size:.75rem;border-bottom:1px solid var(--line2)}
th.c,td.c{text-align:center}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tbody tr:hover td{background:#fafafc}
tr.total td{font-weight:700;background:#fafafc}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.zero{color:#c7c7cc}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.74rem;font-weight:600;white-space:nowrap}
.chip.r{background:var(--red-bg);color:var(--red)}.chip.a{background:var(--amber-bg);color:var(--amber)}.chip.g{background:var(--green-bg);color:var(--green)}.chip.n{background:var(--gray-bg);color:var(--muted)}.chip.b{background:var(--blue-bg);color:var(--blue)}
.bar{display:flex;align-items:center;gap:8px;min-width:110px}
.bar b{flex:1;height:6px;background:var(--gray-bg);border-radius:3px;overflow:hidden;display:block}
.bar b i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar span{font-variant-numeric:tabular-nums;font-size:.8rem;min-width:36px;text-align:right}
td.heat{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
input,select,textarea,button{font:inherit;letter-spacing:inherit}
.inp{width:100%;min-width:90px;padding:6px 9px;border:1px solid var(--line2);background:#fff;color:#0058b0;border-radius:8px;font-size:.84rem}
.inp:focus,.fl:focus,textarea:focus,.fg input:focus,.fg select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px rgba(0,113,227,.2)}
.btn{background:rgba(120,120,128,.1);border:0;color:var(--ink);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:.84rem;font-weight:500;transition:background .15s}
.btn:hover{background:rgba(120,120,128,.18)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{background:#0077ed}
.btn.dng{color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fl{padding:8px 12px;border:1px solid var(--line2);background:#fff;border-radius:10px;font-size:.85rem;max-width:230px}
.fl.q{min-width:240px}
.pager{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:.84rem;color:var(--muted)}
tr.clk{cursor:pointer}
.miss{color:var(--amber);font-size:.72rem;font-weight:600}
.dr-bg{position:fixed;inset:0;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:50;display:none}
.dr-bg.on{display:block}
.drawer{position:fixed;top:10px;right:10px;bottom:10px;width:min(620px,calc(100% - 20px));background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);z-index:51;box-shadow:0 20px 60px rgba(0,0,0,.28);border-radius:22px;display:none;flex-direction:column;overflow:hidden}
.drawer.on{display:flex}
.dr-h{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dr-h h4{margin:0;font-size:1.1rem;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.dr-h small{color:var(--muted)}
.dr-b{padding:4px 22px 24px;overflow:auto;flex:1}
.grp{margin-top:22px}
.grp h5{margin:0 0 10px;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.grp h5::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.grp.b h5::before{background:#af52de}.grp.c h5::before{background:#34c759}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
.fg label{display:block;font-size:.74rem;color:var(--muted);font-weight:600;margin-bottom:3px}
.fg textarea,.fg input,.fg select{width:100%;padding:8px 10px;border:1px solid var(--line2);background:#fff;border-radius:10px;font-size:.9rem;color:#0058b0}
.fg textarea{min-height:64px;resize:vertical}
.fg .ro{background:var(--gray-bg);border-radius:10px;border:0;color:var(--ink);padding:8px 10px;font-size:.9rem;min-height:36px}
.dr-f{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between}
.guide{display:grid;gap:0}
.guide .row{display:grid;grid-template-columns:240px 1fr;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.guide .row:first-child{border-top:0}
.guide .row b{color:var(--ink)}
.set-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.set-g textarea{width:100%;min-height:150px;padding:10px;border:1px solid var(--line2);background:#fff;border-radius:10px;font-size:.88rem;color:#0058b0}
.set-g label{font-weight:600;font-size:.85rem;color:var(--ink);display:block;margin-bottom:6px}
.empty{padding:32px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:22px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:520px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog form{padding:22px}
dialog h4{margin:0 0 14px;font-size:1.2rem;font-weight:700;letter-spacing:-.02em}
dialog .fg{margin-bottom:16px}
@media (max-width:760px){
  html{font-size:14px}
  .top-in{padding:8px 14px}nav.tabs{margin-left:0;width:100%;overflow:auto;flex-wrap:nowrap}nav.tabs button{white-space:nowrap}
  main{padding:18px 14px 56px}h2.page{font-size:1.55rem}
  .fg{grid-template-columns:1fr}.guide .row{grid-template-columns:1fr;gap:2px}
  .drawer{top:0;right:0;bottom:0;width:100%;border-radius:0}
}

.seg{display:inline-flex;background:rgba(120,120,128,.12);padding:3px;border-radius:10px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.84rem;font-weight:500;color:var(--ink)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.grp-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.grp-h .bar{width:160px;min-width:0;flex:none}
.muted{color:var(--muted);font-size:.8rem}
.set{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.set-h{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.set-h:hover{background:#fafafc}
.chev{color:var(--muted);transition:transform .15s;font-size:1.3rem;width:14px;line-height:1}
.set.open .chev{transform:rotate(90deg)}
.set-t{flex:1;min-width:0}.set-t b{display:block;font-weight:600}.set-t small{color:var(--muted);font-size:.78rem}
.set-b{border-top:1px solid var(--line);padding:12px 16px 16px;background:#fbfbfd}
.set-tools{display:flex;gap:12px;align-items:center;justify-content:space-between}
.chk{display:flex;gap:8px;align-items:center;font-size:.85rem;cursor:pointer}
.inst{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.inst-h{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#f5f5f7;flex-wrap:wrap}
.inst table th{position:static;background:#fff}
@media (max-width:760px){.set-h>div[style*="width:140px"]{display:none}}
@media print{
  header.top,.filters,.pager,.btn,.dr-bg,.drawer{display:none!important}
  body{background:#fff}main{padding:0}.card,.kpi,.tw,.ring-card{box-shadow:none;border:1px solid #ddd}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="logo" id="logo">FGROUP</span><h1>Rà soát pháp lý<small>Phòng Pháp chế · FGROUP</small></h1></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="tools">
    <span class="saved" id="saved"></span>
    <button class="btn" id="btn-mode" title="Chuyển giữa chế độ Kiểm kê và Đầy đủ (kiểm kê + rà soát pháp lý)"></button>
    <button class="btn" id="btn-export" title="Tải bản sao lưu dữ liệu (.json)">Sao lưu</button>
    <button class="btn" id="btn-import" title="Nạp lại bản sao lưu (.json)">Nạp lại</button>
    <button class="btn" id="btn-csv" title="Xuất bảng theo dõi hồ sơ ra CSV (mở bằng Excel)">Xuất CSV</button>
    <input type="file" id="file-import" accept=".json,application/json" hidden>
  </div>
</div></header>
<main id="view"></main>

<div class="dr-bg" id="dr-bg"></div>
<aside class="drawer" id="drawer" aria-label="Chi tiết hạng mục"></aside>
<dialog id="dlg"></dialog>

/* ---------- tiện ích ---------- */
const $=s=>document.querySelector(s);
const isInv=()=>S.mode!=='full';
const isShort=it=>it.status==='Đã đủ'&&it.need&&(+it.have||0)<+it.need;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isoToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const TODAY=isoToday();
function ts(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}
function daysTo(s){return Math.round((ts(s)-ts(TODAY))/864e5)}
function vdate(s){if(!s)return '';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y}
const isNum=x=>typeof x==='number'&&isFinite(x);
const pct=x=>isNum(x)?Math.round(x*100)+'%':'–';
const ratio=(a,b)=>b>0?a/b:null;
const cnt=(a,f)=>a.reduce((n,x)=>n+(f(x)?1:0),0);
function opts(list,sel,blank=true){return (blank?'<option value=""></option>':'')+list.map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join('')}
function warnLabel(w){return w==='Quá hạn'?'<span class="chip r">Quá hạn</span>':w==='Sắp đến hạn'?'<span class="chip a">Sắp đến hạn</span>':''}

/* ---------- logic tính toán (tương đương công thức Excel) ---------- */
function derive(it,idx){
  const na=it.status==='Không áp dụng';
  let w1='';
  if(it.due && it.status!=='Đã đủ' && !na){const d=daysTo(it.due); w1=d<0?'Quá hạn':(d<=S.warnDays?'Sắp đến hạn':'')}
  const issue=it.result==='Cần hoàn thiện'||it.result==='Vi phạm';
  let w2='';
  if(it.fixdue && issue && it.fixstatus!=='Đã hoàn tất'){const d=daysTo(it.fixdue); w2=d<0?'Quá hạn':(d<=S.warnDays?'Sắp đến hạn':'')}
  const open=issue && it.fixstatus!=='Đã hoàn tất' && !na;
  let score=null;
  if(open){
    score=(it.prio?(5-(+it.prio[1]||5))*1000:0)+({'Cao':300,'Trung bình':200,'Thấp':100}[it.risk]||0)+(it.tgd==='Có'?50:0)+(w2==='Quá hạn'?30:0)+(100000-idx)/1e6;
  }
  let days=(it.found&&it.done)?Math.round((ts(it.done)-ts(it.found))/864e5):null;
  const missing=open?[['risk','rủi ro'],['prio','ưu tiên'],['area','lĩnh vực'],['owner','owner'],['found','ngày phát hiện']].filter(([k])=>!it[k]).map(x=>x[1]):[];
  return {na,w1,w2,issue,open,score,days,missing};
}
function gshort(g){const m=/^([IVX]+)\./.exec(g||'');return m?(GSHORT[m[1]]||g):g}
function compute(){
  const rows=S.items.map((it,i)=>({it,i,d:derive(it,i)}));
  const byDn={};
  S.dn.forEach(dn=>{byDn[dn.name]=[]});
  rows.forEach(r=>{(byDn[r.it.dn]=byDn[r.it.dn]||[]).push(r)});
  const dnStats=S.dn.map(dn=>{
    const rs=byDn[dn.name]||[]; const total=rs.length;
    const c=n=>cnt(rs,r=>r.it.status===n);
    const na=c('Không áp dụng'), done=c('Đã đủ'), den=total-na;
    const overdue=cnt(rs,r=>r.d.w1==='Quá hạn');
    const res=n=>cnt(rs,r=>r.it.result===n);
    const concl=res('Phù hợp')+res('Cần hoàn thiện')+res('Vi phạm');
    const issues=res('Cần hoàn thiện')+res('Vi phạm');
    const notFixed=cnt(rs,r=>r.d.open);
    const risk=n=>cnt(rs,r=>r.it.risk===n&&r.it.fixstatus!=='Đã hoàn tất');
    const kk=ratio(done,den);
    const state=total===0?'Chưa bắt đầu':(den===0||done===den)?'Hoàn tất':(c('Chưa rà soát')===total?'Chưa bắt đầu':'Đang rà soát');
    const groups={};
    rs.forEach(r=>{const g=gshort(r.it.group);(groups[g]=groups[g]||[]).push(r)});
    return {dn,total,chua:c('Chưa rà soát'),dang:c('Đang thu thập'),thieu:c('Thiếu – cần bổ sung'),done,na,den,overdue,kk,state,
      pending:res('Chưa đánh giá'),ok:res('Phù hợp'),fix:res('Cần hoàn thiện'),vp:res('Vi phạm'),
      rHigh:risk('Cao'),rMid:risk('Trung bình'),rLow:risk('Thấp'),notFixed,issues,
      kl:ratio(concl,den),kp:issues?(issues-notFixed)/issues:null,concl,
      groups};
  });
  const T=k=>dnStats.reduce((n,s)=>n+s[k],0);
  const tot={total:T('total'),chua:T('chua'),dang:T('dang'),thieu:T('thieu'),done:T('done'),na:T('na'),overdue:T('overdue'),
    pending:T('pending'),ok:T('ok'),fix:T('fix'),vp:T('vp'),rHigh:T('rHigh'),rMid:T('rMid'),rLow:T('rLow'),notFixed:T('notFixed'),issues:T('issues'),concl:T('concl')};
  tot.den=tot.total-tot.na; tot.kk=ratio(tot.done,tot.den); tot.kl=ratio(tot.concl,tot.den);
  tot.kp=tot.issues?(tot.issues-tot.notFixed)/tot.issues:null;
  const open=rows.filter(r=>r.d.open);
  const sorted=[...open].sort((a,b)=>b.d.score-a.d.score);
  const dayArr=rows.filter(r=>r.d.days!==null).map(r=>r.d.days);
  return {rows,dnStats,tot,open,sorted,avgDays:dayArr.length?dayArr.reduce((a,b)=>a+b,0)/dayArr.length:null};
}
function breakdown(open,list,fn){
  const mk=()=>({open:0,high:0,over:0,tgd:0});
  const out=list.map(n=>({n,...mk()})), other={n:'Chưa xếp loại / ngoài danh sách',...mk()};
  open.forEach(r=>{const k=fn(r.it);const o=out.find(x=>x.n===k)||other;o.open++;if(r.it.risk==='Cao')o.high++;if(r.d.w2==='Quá hạn')o.over++;if(r.it.tgd==='Có')o.tgd++});
  const sum=[...out,other].reduce((a,x)=>({open:a.open+x.open,high:a.high+x.high,over:a.over+x.over,tgd:a.tgd+x.tgd}),mk());
  return {rows:out,other,sum};
}

const n0=v=>`<td class="num${v?'':' zero'}">${v}</td>`;
function bar(p){return `<div class="bar"><b><i style="width:${isNum(p)?Math.round(p*100):0}%"></i></b><span>${pct(p)}</span></div>`}
function heat(p){if(!isNum(p))return '<td class="heat" style="color:#b4bccb">–</td>';const h=Math.round(p*120);return `<td class="heat" style="background:hsl(${h} 70% 90%);color:hsl(${h} 60% 25%)">${pct(p)}</td>`}
function kpi(l,n,s='',cls=''){return `<div class="kpi ${cls}"><div class="l">${l}</div><div class="n">${n}</div>${s?`<div class="s">${s}</div>`:''}</div>`}
function ring(l,p,s,color){const v=isNum(p)?Math.round(p*100):0;return `<div class="ring-card"><div class="ring" style="--p:${v};--c:${color}"><i>${pct(p)}</i></div><div><div class="l">${l}</div><div class="s">${s}</div></div></div>`}
function stateChip(s){return s==='Hoàn tất'?'<span class="chip g">Hoàn tất</span>':s==='Đang rà soát'?'<span class="chip a">Đang rà soát</span>':'<span class="chip n">Chưa bắt đầu</span>'}
function riskChip(r){return r==='Cao'?'<span class="chip r">Cao</span>':r==='Trung bình'?'<span class="chip a">Trung bình</span>':r==='Thấp'?'<span class="chip g">Thấp</span>':'<span class="chip n">—</span>'}
function prioChip(p){if(!p)return '<span class="chip n">—</span>';return `<span class="chip ${p[1]==='1'?'r':p[1]==='2'?'a':p[1]==='3'?'b':'n'}">${esc(p)}</span>`}
function resultChip(r){return r==='Vi phạm'?'<span class="chip r">Vi phạm</span>':r==='Cần hoàn thiện'?'<span class="chip a">Cần hoàn thiện</span>':r==='Phù hợp'?'<span class="chip g">Phù hợp</span>':'<span class="chip n">Chưa đánh giá</span>'}
function statusChip(s){return s==='Đã đủ'?'<span class="chip g">Đã đủ</span>':s==='Thiếu – cần bổ sung'?'<span class="chip r">Thiếu – cần bổ sung</span>':s==='Đang thu thập'?'<span class="chip a">Đang thu thập</span>':s==='Không áp dụng'?'<span class="chip n">Không áp dụng</span>':'<span class="chip n">Chưa rà soát</span>'}

function issueRow(r,i,which){

  const rows=S.items.map((it,i)=>({it,i,d:derive(it,i)})).filter(r=>r.it.dn===dn);
  const G=new Map();
  rows.forEach(r=>{const g=r.it.group,k=setKey(r.it);if(!G.has(g))G.set(g,new Map());const m=G.get(g);if(!m.has(k))m.set(k,{k,title:r.it.doc_group||'(Bộ hồ sơ chưa đặt tên)',rows:[]});m.get(k).rows.push(r)});
  treeKeys=[];
  let h='';
  G.forEach((m,g)=>{
    const sets=[...m.values()].filter(s=>!filtering||s.rows.some(match));
    if(!sets.length)return;
    const all=sets.flatMap(s=>s.rows),den=cnt(all,r=>!r.d.na),done=cnt(all,r=>r.it.status==='Đã đủ');
    h+=`<div class="grp-h"><h3 class="sec" style="margin:26px 0 10px">${esc(g)}</h3><span class="muted">${done}/${den} đã đủ</span>${bar(ratio(done,den))}</div>`;
    sets.forEach(s=>{
      const idx=treeKeys.push(s.k)-1;
      const open=OPEN.has(s.k)||filtering;
      const den2=cnt(s.rows,r=>!r.d.na),done2=cnt(s.rows,r=>r.it.status==='Đã đủ');
      const nInst=new Set(s.rows.map(r=>r.it.instno||1)).size;
      const rep=REP.test(s.title),st=setsStore()[s.k],conf=!!(st&&st.confirmed);
      const over=cnt(s.rows,r=>r.d.w1==='Quá hạn'),sh=cnt(s.rows,r=>isShort(r.it));
      h+=`<div class="set${open?' open':''}"><div class="set-h" data-toggle="${idx}"><span class="chev">›</span><div class="set-t"><b>${esc(s.title)}</b><small>${nInst} lần/kỳ · ${done2}/${den2} đã đủ${over?` · <span style="color:var(--red)">${over} quá hạn</span>`:''}${sh?` · <span class="miss">${sh} thiếu số bản</span>`:''}</small></div>${rep?(conf?'<span class="chip g">Đã xác nhận số lần</span>':'<span class="chip a">Chưa xác nhận số lần</span>'):''}<div style="width:140px">${bar(ratio(done2,den2))}</div></div>`;
      if(open){
        const byInst=new Map();
        s.rows.slice().sort((a,b)=>(a.it.instno||1)-(b.it.instno||1)||a.i-b.i).forEach(r=>{const n=r.it.instno||1;if(!byInst.has(n))byInst.set(n,[]);byInst.get(n).push(r)});
        h+=`<div class="set-b"><div class="set-tools">${rep?`<label class="chk"><input type="checkbox" data-conf="${idx}"${conf?' checked':''}> Đã xác nhận đủ số lần/kỳ</label>`:'<span></span>'}<button class="btn" data-addinst="${idx}">+ Thêm lần/kỳ</button></div>`;
        byInst.forEach((rs,n)=>{
          const shown=filtering?rs.filter(match):rs;if(!shown.length)return;
          const f0=rs[0].it,d1=cnt(rs,r=>r.it.status==='Đã đủ'),d2=cnt(rs,r=>!r.d.na);
          h+=`<div class="inst"><div class="inst-h"><span class="chip b">Lần ${n}</span><input class="inp" placeholder="Mô tả lần/kỳ (vd: ĐHĐCĐ thường niên 2023)" value="${esc(f0.inst||'')}" data-bi="${idx}|${n}|inst" style="flex:1;min-width:200px"><input class="inp" type="date" value="${f0.instdate||''}" data-bi="${idx}|${n}|instdate" style="width:150px"><span class="muted">${d1}/${d2} đủ</span>${byInst.size>1?`<button class="btn dng" data-delinst="${idx},${n}">Xóa lần</button>`:''}</div>
          <table><thead><tr><th>Hạng mục</th><th>Tình trạng</th><th class="c">Số bản</th><th>Thiếu gì · đơn vị giữ</th><th>Hạn</th><th></th>${isInv()?'':'<th>Kết quả rà soát</th><th>Rủi ro</th>'}</tr></thead><tbody>`;
          shown.forEach(r=>{const it=r.it;
            h+=`<tr class="clk" data-open="${r.i}"><td style="min-width:260px">${esc(it.doc)}</td><td><select class="inp" data-b="it|${r.i}|status" style="min-width:140px">${opts(STATUS,it.status,false)}</select></td><td class="c" style="white-space:nowrap">${it.need?(it.have||0)+'/'+it.need:'<span style="color:#c7c7cc">–</span>'}${isShort(it)?'<div class="miss">chưa đủ số bản</div>':''}</td><td style="min-width:140px">${esc(it.missing||'')}${it.holder?`<div class="muted">${esc(it.holder)}</div>`:''}</td><td style="white-space:nowrap">${it.due?vdate(it.due):''}</td><td>${warnLabel(r.d.w1)}</td>${isInv()?'':`<td><select class="inp" data-b="it|${r.i}|result" style="min-width:128px">${opts(RESULT,it.result,false)}</select></td><td>${riskChip(it.risk)}</td>`}</tr>`});
          h+='</tbody></table></div>';
        });
        h+='</div>';
      }
      h+='</div>';
    });
  });
  if(!h)h='<div class="card empty">Không có bộ hồ sơ nào khớp bộ lọc.</div>';
  $('#trk-body').innerHTML=h;
}
function dlgInst(k){
  const rows=S.items.filter(it=>setKey(it)===k);if(!rows.length)return;
  const minN=Math.min(...rows.map(r=>r.instno||1)),maxN=Math.max(...rows.map(r=>r.instno||1));
  const tpl=rows.filter(r=>(r.instno||1)===minN);
  const d=$('#dlg');
  d.innerHTML=`<form method="dialog"><h4>Thêm lần/kỳ</h4><p class="note" style="margin:-6px 0 12px">Tạo thêm một bộ ${tpl.length} hạng mục giống lần đầu cho “${esc(rows[0].doc_group||'bộ hồ sơ này')}”.</p><div class="fg"><div class="full"><label>Mô tả lần/kỳ</label><input id="i-l" placeholder="vd: ĐHĐCĐ thường niên 2023"></div><div><label>Ngày (nếu có)</label><input type="date" id="i-d"></div></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" value="cancel">Hủy</button><button class="btn pri" id="i-ok" value="ok">Thêm</button></div></form>`;
  d.showModal();
  $('#i-ok').onclick=()=>{
    const n=maxN+1,lab=$('#i-l').value.trim(),dt=$('#i-d').value;
    tpl.forEach(t=>{const o={code:t.code+'/L'+n,dn:t.dn,group:t.group,doc_group:t.doc_group,doc:t.doc,status:'Chưa rà soát',result:'Chưa đánh giá',instno:n};
      if(lab)o.inst=lab;if(dt)o.instdate=dt;Object.keys(o).forEach(x=>o[x]===undefined&&delete o[x]);S.items.push(o)});
    OPEN.add(k);save();treeBody();
  };
}
function delInst(k,n){
  if(!confirm('Xóa lần/kỳ này cùng toàn bộ hạng mục của lần đó? Thao tác không thể hoàn tác.'))return;
  S.items=S.items.filter(it=>!(setKey(it)===k&&(it.instno||1)===n));save();treeBody();
}

let curItem=-1;
function fld(label,key,it,type,list,full){
  const b=`data-b="it|${curItem}|${key}"`;let c;
  if(type==='select')c=`<select ${b}>${opts(list,it[key])}</select>`;
  else if(type==='area')c=`<textarea ${b}>${esc(it[key]||'')}</textarea>`;
  else if(type==='num')c=`<input type="number" min="0" ${b} value="${it[key]||''}">`;
  else if(type==='date')c=`<input type="date" ${b} value="${it[key]||''}">`;
  else if(type==='list')c=`<input ${b} list="${list}" value="${esc(it[key]||'')}">`;
  else c=`<input ${b} value="${esc(it[key]||'')}">`;
  return `<div class="${full?'full':''}"><label>${label}</label>${c}</div>`;
}

function refreshCalc(){

  <h3 class="sec">4. Định nghĩa các giá trị (quy ước đề xuất – chỉnh theo thực tế)</h3><div class="card guide">
  ${R('Tình trạng (kiểm kê)','Chưa rà soát: chưa kiểm tra hạng mục. Đang thu thập: đã xác định cần có, đang lấy hồ sơ. Thiếu – cần bổ sung: đã kiểm kê, hồ sơ thiếu/chưa hoàn chỉnh. Đã đủ: hồ sơ đầy đủ. Không áp dụng: hạng mục không phát sinh với DN.')}
  ${R('Đã đủ (kiểm kê)','Quy ước mặc định: bản sao có đủ chữ ký, con dấu, ngày tháng và đủ số bản (Số bản đã có = Số bản cần có). Hạng mục nhiều văn bản (ví dụ GCN ĐKDN các lần thay đổi) ghi tổng số bản cần có. Mục nào “Đã đủ” nhưng thiếu số bản sẽ bị đánh dấu cảnh báo.')}
  ${R('Chế độ kiểm kê / đầy đủ','Chế độ Kiểm kê (mặc định): ẩn đánh giá pháp lý, khắc phục và Dashboard TGĐ, chỉ còn tiến độ kiểm kê. Chế độ Đầy đủ: bật lại toàn bộ. Dữ liệu không mất khi chuyển chế độ.')}
  ${R('Kết quả rà soát','Chưa đánh giá: chưa có kết luận. Phù hợp: đáp ứng quy định pháp luật và quy định nội bộ. Cần hoàn thiện: có thiếu sót khắc phục được (bổ sung, sửa, hợp thức hóa). Vi phạm: trái quy định, phát sinh rủi ro bị xử phạt, vô hiệu hoặc tranh chấp.')}
  ${R('Mức độ rủi ro','Cao: có thể gây vô hiệu giao dịch/nghị quyết, xử phạt, hoặc trách nhiệm của người quản lý. Trung bình: sai sót cần sửa nhưng chưa ảnh hưởng trực tiếp hiệu lực. Thấp: lỗi hình thức. Chỉ điền khi Kết quả là Cần hoàn thiện hoặc Vi phạm.')}
  ${R('Ưu tiên xử lý','P1 – Khẩn cấp: phải xử lý ngay. P2 – Cao: xử lý trong đợt hiện tại. P3 – Trung bình: đưa vào kế hoạch. P4 – Theo dõi: chưa cần xử lý ngay.')}
  ${R('Hệ quả nếu không xử lý','Ghi theo chuỗi: thiếu / sai gì → nguy cơ gì → hậu quả cuối cùng. Ví dụ: không có giấy phép → nguy cơ xử phạt → đình chỉ hoạt động.')}
  ${R('Lĩnh vực bị ảnh hưởng','Tài sản, Dự án, Doanh thu, Nghĩa vụ tài chính, Tranh chấp, Giấy phép, Khác. Chọn lĩnh vực chính; dùng cho thống kê ở Dashboard TGĐ.')}
  ${R('Cần TGĐ quyết định','Có: vấn đề cần TGĐ phê duyệt phương án / chỉ đạo. Vấn đề đánh dấu Có được cộng điểm và liệt kê riêng ở Dashboard TGĐ, mục B.')}</div>
  <h3 class="sec">5. Cách tính chính</h3><div class="card guide">
  ${R('% kiểm kê','Đã đủ ÷ (Tổng số mục − Không áp dụng).')}${R('% có kết luận pháp lý','(Phù hợp + Cần hoàn thiện + Vi phạm) ÷ (Tổng số mục − Không áp dụng).')}
  ${R('% khắc phục','Số vấn đề (Cần hoàn thiện + Vi phạm) đã “Đã hoàn tất” ÷ tổng số vấn đề.')}
  ${R('Cảnh báo hạn','Quá hạn: có hạn, chưa Đã đủ/Không áp dụng (kiểm kê) hoặc chưa khắc phục xong, và hạn &lt; hôm nay. Sắp đến hạn: còn ≤ số ngày cảnh báo sớm (mặc định 7).')}
  ${R('Số ngày xử lý','Ngày hoàn tất thực tế − Ngày phát hiện. Trung bình các vấn đề đã xử lý xong hiển thị ở Dashboard TGĐ.')}
  ${R('Điểm xếp hạng Top 10','Ưu tiên (P1 4.000 … P4 1.000) + Rủi ro (Cao 300 / TB 200 / Thấp 100) + Cần TGĐ quyết định 50 + Quá hạn 30. Chỉ tính vấn đề đang mở.')}</div>`;
}

/* ---------- điều hướng ---------- */
const TABS=[['overview','Tổng quan',vOverview],['dash','Dashboard TGĐ',vDash],['dn','Danh mục DN',vDN],['track','Theo dõi hồ sơ',vTrack],['set','Cài đặt',vSet],['guide','Hướng dẫn',vGuide]];
let tab=(location.hash||'#overview').slice(1); if(!TABS.find(t=>t[0]===tab))tab='overview';
function render(){
  if(isInv()&&tab==='dash')tab='overview';
  $('#btn-mode').textContent=isInv()?'Chế độ: Kiểm kê':'Chế độ: Đầy đủ';
  $('#tabs').innerHTML=TABS.filter(t=>!(isInv()&&t[0]==='dash')).map(([k,l])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${l}</button>`).join('');
  $('#view').innerHTML=TABS.find(t=>t[0]===tab)[2]();
  if(tab==='track')trackBody();
  if(!$('#dl-people')){const d=document.createElement('div');d.id='dl-wrap';document.body.appendChild(d)}
  $('#dl-wrap').innerHTML=`<datalist id="dl-people">${S.people.map(p=>`<option value="${esc(p)}">`).join('')}</datalist><datalist id="dl-checks">${S.checks.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>`;
}
function go(k){tab=k;try{history.replaceState(null,'','#'+k)}catch(e){}render();window.scrollTo(0,0)}

/* ---------- sự kiện ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const tb=t.closest('[data-tab]'); if(tb) return go(tb.dataset.tab);
  if(t.closest('select,input,textarea')) return;
  const tv=t.closest('[data-tv]'); if(tv){F.view=tv.dataset.tv;if(F.view==='tree'&&!F.dn)F.dn=S.dn[0]?S.dn[0].name:'';render();return}
  const tg=t.closest('[data-toggle]'); if(tg){const k=treeKeys[+tg.dataset.toggle];OPEN.has(k)?OPEN.delete(k):OPEN.add(k);treeBody();return}
  const ai=t.closest('[data-addinst]'); if(ai){dlgInst(treeKeys[+ai.dataset.addinst]);return}
  const di=t.closest('[data-delinst]'); if(di){const p=di.dataset.delinst.split(',');delInst(treeKeys[+p[0]],+p[1]);return}
  if(t.id==='t-open'){treeKeys.forEach(k=>OPEN.add(k));treeBody();return} if(t.id==='t-close'){OPEN.clear();treeBody();return}
  const op=t.closest('[data-open]'); if(op) return openDrawer(+op.dataset.open);
  if(t.id==='dr-x'||t.id==='dr-ok') return closeDrawer();
  if(t.id==='dr-del'){ if(confirm('Xóa hạng mục này? Thao tác không thể hoàn tác.')){S.items.splice(curItem,1);save();closeDrawer();} return;}
  if(t.id==='pg-prev'){F.page--;trackBody();return} if(t.id==='pg-next'){F.page++;trackBody();return}
  if(t.id==='f-reset'){Object.assign(F,{dn:'',group:'',status:'',result:'',flag:'',q:'',page:0});render();return}
  if(t.id==='it-add') return dlgItem();
  if(t.id==='dn-add') return dlgDN();
  if(t.dataset.deldn!==undefined){const i=+t.dataset.deldn,n=S.dn[i].name,c=S.items.filter(x=>x.dn===n).length;if(confirm(`Xóa DN “${n}” và ${c} hạng mục của DN này?`)){S.dn.splice(i,1);S.items=S.items.filter(x=>x.dn!==n);save();render()}return}
  if(t.id==='reset-all'){if(confirm('Khôi phục toàn bộ dữ liệu về bản gốc trong file Excel? Mọi thay đổi bạn đã nhập sẽ mất (hãy Sao lưu trước).')){S=clone(SEED);try{localStorage.removeItem(KEY)}catch(e){}render()}return}
});
$('#dr-bg').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&curItem>=0)closeDrawer()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.conf!==undefined){const k=treeKeys[+t.dataset.conf];const st=setsStore();st[k]=st[k]||{};st[k].confirmed=t.checked;save();treeBody();return}
  if(t.dataset.bi){const p=t.dataset.bi.split('|'),k=treeKeys[+p[0]],n=+p[1],f=p[2];S.items.forEach(it=>{if(setKey(it)===k&&(it.instno||1)===n){if(t.value)it[f]=t.value;else delete it[f]}});save();return}
  if(t.id&&t.id.startsWith('f-')&&t.id!=='f-q'){F[t.id.slice(2)]=t.value;F.page=0;trackBody();return}
  if(t.dataset.list){const v=t.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,t.dataset.list==='checks'?30:10);S[t.dataset.list]=v;save();render();return}
  if(t.dataset.param){let v=parseFloat(t.value);if(!isFinite(v)||v<0)v=0;if(t.dataset.param==='lag')v=Math.min(100,v)/100;else v=Math.round(v);S[t.dataset.param]=v;save();return}
  if(t.id==='file-import'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.items||!o.dn)throw 0;S=o;save();render();alert('Đã nạp dữ liệu từ bản sao lưu.')}catch(x){alert('File không đúng định dạng sao lưu của công cụ này.')}};r.readAsText(f);t.value='';return}
  const b=t.dataset.b; if(!b) return;
  const [kind,i,key]=b.split('|');let v=t.value;
  if(kind==='it'){
    const it=S.items[+i];if(v==='')delete it[key];else it[key]=v;
    it.updated=TODAY;
    if(key==='fixstatus'&&v==='Đã hoàn tất'&&!it.done)it.done=TODAY;
    save();
    if(curItem>=0)refreshCalc();
    if(tab==='track'&&curItem<0)trackBody();
  }else if(kind==='dn'){
    const d=S.dn[+i];
    if(key==='name'){v=v.trim();if(!v){render();return}if(S.dn.some((x,j)=>j!==+i&&x.name===v)){alert('Tên DN đã tồn tại.');render();return}S.items.forEach(x=>{if(x.dn===d.name)x.dn=v})}
    if(v==='')delete d[key];else d[key]=v;if(key==='name')d.name=v;
    save();render();
  }else if(kind==='stg'){const s=S.stages[+i];if(v)s[key]=v;else s[key]=null;save();render()}
});
document.addEventListener('input',e=>{if(e.target.id==='f-q'){F.q=e.target.value;F.page=0;trackBody()}});
$('#btn-mode').onclick=()=>{S.mode=isInv()?'full':'inv';save();render()};
$('#btn-export').onclick=()=>dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'ra-soat-phap-ly_'+TODAY+'.json');
$('#btn-import').onclick=()=>$('#file-import').click();
$('#btn-csv').onclick=()=>{
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[FIELDS.map(f=>q(f[1])).join(',')];
  S.items.forEach(it=>lines.push(FIELDS.map(f=>q(it[f[0]])).join(',')));
  dl(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),'theo-doi-ho-so_'+TODAY+'.csv');
};
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ---------- hộp thoại thêm ---------- */
function dlgItem(){
  const d=$('#dlg');const groups=[...new Set(S.items.map(i=>i.group))];
  d.innerHTML=`<form method="dialog"><h4>Thêm hạng mục hồ sơ</h4><div class="fg">
   <div><label>Doanh nghiệp</label><select id="n-dn">${S.dn.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div>
   <div><label>Nhóm hồ sơ</label><select id="n-group">${groups.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
   <div class="full"><label>Tên hồ sơ (nhóm nhỏ)</label><input id="n-dg"></div><div class="full"><label>Hạng mục hồ sơ cần có *</label><input id="n-doc"></div></div>
   <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" value="cancel">Hủy</button><button class="btn pri" id="n-ok" value="ok">Thêm</button></div></form>`;
  d.showModal();
  $('#n-ok').onclick=ev=>{const doc=$('#n-doc').value.trim();if(!doc){ev.preventDefault();$('#n-doc').focus();return}
    const dnName=$('#n-dn').value,g=$('#n-group').value;const stt=S.dn.findIndex(x=>x.name===dnName)+1;
    const roman=(/^([IVX]+)\./.exec(g)||[])[1]||'X';const n=S.items.filter(x=>x.dn===dnName&&x.group===g).length+1;
    S.items.push({code:String(stt).padStart(2,'0')+'-'+roman+'-NEW.'+String(n).padStart(2,'0'),dn:dnName,group:g,doc_group:$('#n-dg').value.trim()||undefined,doc,status:'Chưa rà soát',result:'Chưa đánh giá'});
    if(!S.items[S.items.length-1].doc_group)delete S.items[S.items.length-1].doc_group;
    save();Object.assign(F,{dn:dnName,page:999});render();};
}
function dlgDN(){
  const d=$('#dlg');
  d.innerHTML=`<form method="dialog"><h4>Thêm doanh nghiệp</h4><div class="fg">
   <div><label>Tên thư mục (ngắn) *</label><input id="d-name"></div><div><label>Vai trò</label><select id="d-role"><option>Công ty con</option><option>Công ty liên kết</option><option>Công ty mẹ</option></select></div>
   <div class="full"><label>Tên đầy đủ</label><input id="d-full"></div>
   <div class="full"><label><input type="checkbox" id="d-copy" checked style="width:auto"> Tạo sẵn bộ hạng mục chuẩn (sao chép từ DN mẫu có 53 hạng mục)</label></div></div>
   <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" value="cancel">Hủy</button><button class="btn pri" id="d-ok" value="ok">Thêm</button></div></form>`;
  d.showModal();
  $('#d-ok').onclick=ev=>{const name=$('#d-name').value.trim();if(!name||S.dn.some(x=>x.name===name)){ev.preventDefault();alert(name?'Tên DN đã tồn tại.':'Vui lòng nhập tên DN.');return}
    if(S.dn.length>=18){ev.preventDefault();alert('Tối đa 18 DN.');return}
    S.dn.push({stt:S.dn.length+1,name,full:$('#d-full').value.trim()||undefined,role:$('#d-role').value,owner:S.people[0],start:TODAY});
    if($('#d-copy').checked){
      const first=x=>!x.instno||x.instno===1;const cntBy={};S.items.filter(first).forEach(x=>{cntBy[x.dn]=(cntBy[x.dn]||0)+1});
      const tpl=Object.keys(cntBy).find(k=>cntBy[k]===53);const stt=String(S.dn.length).padStart(2,'0');
      if(tpl){let k=0;S.items.filter(x=>x.dn===tpl&&first(x)).forEach(x=>{S.items.push({code:stt+x.code.slice(2),dn:name,group:x.group,doc_group:x.doc_group,doc:x.doc,status:'Chưa rà soát',result:'Chưa đánh giá'})});S.items.forEach(x=>{if(!x.doc_group)delete x.doc_group})}
    }
    save();render();};
}

(function(){const l=document.getElementById('logo');if(LOGO)l.innerHTML='<img alt="FGROUP" src="'+LOGO+'">'})();
render();
</script>
